name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "iOS build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        env:
          IOS_CONFIGURATION: ${{ inputs.configuration }}
          NUVIO_GRADLE_JVMARGS: "-Xmx12288M -XX:MaxMetaspaceSize=2048m"
          NUVIO_KOTLIN_NATIVE_JVMARGS: "-Xmx8192M"
        run: ./scripts/build-ios-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-ios-${{ inputs.configuration }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
